# Local production-like stack: `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: mini_empire
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mini:${POSTGRES_PASSWORD:-change_me_locally}@db:5432/mini_empire
      IP_HASH_SALT: ${IP_HASH_SALT:-local-compose-salt-change-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLIENT_DIST: /app/client/dist
      NODE_ENV: production
      TRUST_PROXY: "false"
    ports:
      - "3000:3000"
volumes:
  pgdata:
